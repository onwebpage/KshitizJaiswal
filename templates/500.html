{% extends "base.html" %}

{% block title %}Server Error - Kshitiz Jaiswal{% endblock %}

{% block content %}
<section class="error-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="error-content">
                    <div class="error-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h1 class="error-title">500</h1>
                    <h2 class="error-subtitle">Server Error</h2>
                    <p class="error-message">
                        Oops! Something went wrong on our end. Our team has been notified and is working to fix this issue. Please try again in a few moments.
                    </p>
                    <div class="error-actions">
                        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg me-3">
                            <i class="fas fa-home me-2"></i>Go Home
                        </a>
                        <button class="btn btn-outline-primary btn-lg" onclick="window.location.reload()">
                            <i class="fas fa-redo me-2"></i>Try Again
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
.error-section {
    padding: 120px 0;
    background: linear-gradient(135deg, var(--gray-100) 0%, var(--white) 100%);
    min-height: 80vh;
    display: flex;
    align-items: center;
}

.error-content {
    padding: 3rem;
}

.error-icon {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, var(--warning-color) 0%, var(--danger-color) 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 2rem;
    box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
}

.error-icon i {
    font-size: 2.5rem;
    color: var(--white);
}

.error-title {
    font-size: 6rem;
    font-weight: 800;
    color: var(--danger-color);
    margin-bottom: 1rem;
    line-height: 1;
}

.error-subtitle {
    color: var(--gray-800);
    margin-bottom: 1rem;
}

.error-message {
    color: var(--gray-600);
    margin-bottom: 3rem;
    font-size: 1.1rem;
    line-height: 1.6;
}

.error-actions .btn {
    border-radius: 50px;
    padding: 0.875rem 2rem;
    font-weight: 600;
}
</style>
{% endblock %}
