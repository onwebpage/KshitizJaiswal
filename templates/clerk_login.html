{% extends "base.html" %}

{% block title %}Login - Kshitiz Jaiswal{% endblock %}

{% block content %}
<style>
    /* Fix Clerk UI centering and styling */
    #clerk-signin-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }
    
    /* Hide the Clerk branding badge that overlaps */
    #clerk-signin-container .cl-internal-b3fm6y {
        display: none !important;
    }
    
    /* Ensure Clerk card is centered */
    #clerk-signin-container > div {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
    }
</style>

<section class="auth-section" style="min-height: 100vh; padding-top: 100px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="text-center mb-4 text-white">
                    <h2 class="mb-3">Welcome Back</h2>
                    <p>Sign in to your account</p>
                </div>
                
                <!-- Clerk Sign-In Component will be mounted here -->
                <div id="clerk-signin-container"></div>
                
                <div class="text-center mt-4 text-white">
                    <p>
                        Don't have an account? 
                        <a href="{{ url_for('clerk_signup') }}" class="text-white fw-bold text-decoration-underline">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    window.addEventListener('load', async function () {
        if (window.Clerk) {
            await Clerk.load();
            
            const signInDiv = document.getElementById('clerk-signin-container');
            if (signInDiv) {
                const afterSignInUrl = '{{ next_url }}';
                
                Clerk.mountSignIn(signInDiv, {
                    redirectUrl: afterSignInUrl,
                    afterSignInUrl: afterSignInUrl,
                    appearance: {
                        elements: {
                            formButtonPrimary: 'btn btn-primary w-100',
                            card: 'border-0'
                        }
                    }
                });
            }
        }
    });
</script>
{% endblock %}
